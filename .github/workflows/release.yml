name: Draft Debian release

on:
  # Only merged code from master is built. Never check out a PR head here.
  pull_request_target:
    branches: [master]
    types: [closed]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create the initial 0.1.0 draft from master
        type: boolean
        default: false
  repository_dispatch:
    types: [ntikuma-release-catch-up]

permissions:
  contents: read

concurrency:
  group: ntikuma-draft-releases
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"
  GOVULNCHECK_VERSION: "v1.6.0"

jobs:
  plan:
    name: Plan draft releases
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.base.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Required to include draft releases. Planning uses GET requests only.
      contents: write
      pull-requests: read
    outputs:
      work: ${{ steps.plan.outputs.work }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - name: Check out trusted master and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Plan unreleased merged PRs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          bootstrap=()
          if [[ "$BOOTSTRAP" == true ]]; then bootstrap+=(--bootstrap); fi
          python3 scripts/release-deb.py plan \
            --output "$RUNNER_TEMP/ntikuma-release-plan.json" "${bootstrap[@]}"
          printf 'artifact=draft-release-plan-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Transfer the release plan
        if: steps.plan.outputs.work == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ runner.temp }}/ntikuma-release-plan.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build release candidates
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.candidates.outputs.artifact }}
    steps:
      - name: Check out trusted master and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Download the release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/asr/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            python3 desktop-file-utils libglib2.0-bin gnome-settings-daemon-common \
            binutils dpkg-dev patchelf
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Build and validate exact release commits
        id: candidates
        run: |
          python3 scripts/release-deb.py build \
            --plan "$RUNNER_TEMP/ntikuma-release-plan.json" \
            --output "$RUNNER_TEMP/ntikuma-release-assets"
          printf 'artifact=draft-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Transfer validated candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.candidates.outputs.artifact }}
          path: ${{ runner.temp }}/ntikuma-release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Prepare GitHub drafts
    needs: [plan, build]
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - name: Check out trusted release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/ntikuma-release-assets

      # This job validates data and uses the API; it never runs candidate code.
      - name: Verify assets and prepare drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release-deb.py publish
          --artifacts "$RUNNER_TEMP/ntikuma-release-assets" --apply
